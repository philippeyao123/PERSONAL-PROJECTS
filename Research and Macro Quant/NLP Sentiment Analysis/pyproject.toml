[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsent"
version = "1.0.0"
description = "Modular three-class sentiment analysis pipeline for financial news (Financial PhraseBank)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bathaix Philippe-Emmanuel Yao" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "nltk>=3.8",
    "textblob>=0.17",
    "joblib>=1.2",
]

[project.optional-dependencies]
smote = ["imbalanced-learn>=0.11"]
dev = ["pytest>=7.0", "imbalanced-learn>=0.11"]

[project.scripts]
finsent = "finsent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
