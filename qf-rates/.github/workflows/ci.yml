name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/qf-rates"
      - name: Python reference
        run: python3 scripts/python_reference.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DQF_ENABLE_SANITIZERS=ON -DQF_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-san --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: >-
          find include src tests examples benchmarks python
          -type f \( -name '*.hpp' -o -name '*.cpp' \)
          -print0 | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure static analysis
        run: >-
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Debug
          -DQF_BUILD_TESTS=OFF -DQF_BUILD_EXAMPLES=OFF
          -DCMAKE_CXX_CLANG_TIDY=clang-tidy
      - name: Run clang-tidy
        run: cmake --build build-tidy --parallel

  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check pybind11 QuantLib
      - name: Configure bindings
        run: >-
          cmake -S . -B build-py -DCMAKE_BUILD_TYPE=Release
          -DQF_BUILD_TESTS=OFF -DQF_BUILD_EXAMPLES=OFF -DQF_BUILD_PYTHON=ON
          -Dpybind11_DIR="$(python3 -m pybind11 --cmakedir)"
      - name: Build bindings
        run: cmake --build build-py --parallel
      - name: Exercise Python API
        env:
          PYTHONPATH: build-py
        run: python3 scripts/python_bindings_smoke.py
      - name: Cross-check QuantLib
        env:
          PYTHONPATH: build-py
        run: >-
          python3 scripts/python_reference.py
          --require-quantlib --require-bindings

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install paper dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended
          python3 -m pip install --disable-pip-version-check matplotlib
      - name: Configure validation benchmark
        run: >-
          cmake -S . -B build-paper -DCMAKE_BUILD_TYPE=Release
          -DQF_BUILD_TESTS=OFF -DQF_BUILD_EXAMPLES=OFF
          -DQF_BUILD_BENCHMARKS=ON -DQF_WARNINGS_AS_ERRORS=ON
      - name: Regenerate numerical evidence
        run: |
          cmake --build build-paper --parallel
          ./build-paper/qf_rates_validation paper/data
          python3 scripts/generate_paper_artifacts.py
      - name: Compile manuscript
        run: |
          mkdir -p paper/build output/pdf
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -outdir=build main.tex
          cd ..
          cp paper/build/main.pdf output/pdf/qf-rates-paper.pdf
      - name: Package arXiv sources
        run: ./scripts/package_arxiv.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qf-rates-paper
          path: |
            output/pdf/qf-rates-paper.pdf
            output/pdf/qf-rates-arxiv-source.tar.gz
