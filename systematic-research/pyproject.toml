[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-research"
version = "0.1.0"
description = "Point-in-time systematic research, backtesting, validation and reporting"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Philippe Yao"}]
keywords = ["quantitative-finance", "backtesting", "systematic-research", "factor-investing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "PyYAML>=6.0,<7",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14,<22"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6",
]

[project.scripts]
sysresearch = "systematic_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
systematic_research = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["systematic_research"]
disable_error_code = [
  "arg-type",
  "call-overload",
  "no-any-return",
  "operator",
  "type-arg",
]

[tool.coverage.run]
source = ["systematic_research"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
